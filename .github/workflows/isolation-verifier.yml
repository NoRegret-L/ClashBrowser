name: Isolation evidence verifier
on:
  push:
    branches: ['test/ohos-isolation-evidence']
    paths: ['ci/verify-ohos-isolation.py', 'ci/test-ohos-isolation-verifier.py', '.github/workflows/isolation-verifier.yml']
  pull_request:
    paths: ['ci/verify-ohos-isolation.py', 'ci/test-ohos-isolation-verifier.py', '.github/workflows/isolation-verifier.yml']
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 ci/test-ohos-isolation-verifier.py
