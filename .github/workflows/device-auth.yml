name: Android WebView device auth
on:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'ci/android-device-test.sh'
      - '.github/workflows/device-auth.yml'
  workflow_dispatch:
    inputs:
      sdk_run:
        description: Successful SDK workflow run ID with matching core source
        required: true
        default: '45970660022'
permissions:
  contents: read
  actions: read
concurrency:
  group: device-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDK_RUN: ${{ inputs.sdk_run || '45970660022' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify matching successful SDK run
        run: |
          set -euo pipefail
          [[ "$SDK_RUN" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SDK_RUN")
          jq -e '.conclusion == "success" and .name == "Mihomo native SDK"' <<< "$run"
          sha=$(jq -er .head_sha <<< "$run")
          git diff --quiet "$sha" HEAD -- core ci/install-loopback.sh .github/workflows/core.yml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SDK_RUN }}
          name: mihomo-android-sdk-experimental
          path: sdk-input
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/android-device-test.sh "$RUNNER_TEMP/clashbrowser-device" "$GITHUB_WORKSPACE/sdk-input"
